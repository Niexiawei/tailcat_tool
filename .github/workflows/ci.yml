name: CI

on:
  push:
    branches: [main, feat/go-rewrite]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: true

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: build
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: test
        run: go test -race ./...

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64,linux/arm64
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: true

      - name: build packages
        env:
          CGO_ENABLED: '0'
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "macOS" ]; then
            sign=-
            if [ -n "$SIGN_IDENTITY" ]; then
              sign="$SIGN_IDENTITY"
            else
              echo "::warning::no macOS signing identity; the dmg is ad-hoc signed and Gatekeeper will block it"
            fi
            go tool mygo build -platform "${{ matrix.platform }}" -sign "$sign"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            # The installer needs NSIS, which mygo build downloads. A runner
            # without it still has to produce the executable, but never
            # without saying that the installer is missing.
            if ! go tool mygo build -platform "${{ matrix.platform }}"; then
              echo "::warning::the Windows installer could not be built (NSIS download failed?); shipping the executable only"
              go tool mygo build -platform "${{ matrix.platform }}" -skip-installer
            fi
          else
            go tool mygo build -platform "${{ matrix.platform }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tailcat-manager-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.AppImage
