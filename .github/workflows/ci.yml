name: CI

on:
  push:
    branches: [main, feat/go-rewrite]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: true

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: build
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: test
        run: go test -race ./...

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: true

      - name: cross compile
        env:
          CGO_ENABLED: '0'
        run: |
          set -e
          for target in linux/amd64 darwin/arm64 darwin/amd64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            GOOS=$os GOARCH=$arch go build -ldflags "-s -w" -o "dist/tm-$os-$arch" ./cmd/tailcat-manager
          done
          ls -l dist
